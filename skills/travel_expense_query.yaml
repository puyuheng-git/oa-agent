# 行程报销查询 Skill。仅在首次启动（Skill 表为空）时导入；之后以管理后台「Skill 管理」为准，
# 改本文件需在后台点「从文件导入」。依赖 Tool 停用或无有效版本时 Skill 校验失败，对话不会使用它。
name: travel_expense_query
display_name: 行程报销查询
version: 1.1.2
description: 查询员工本人的行程报销单列表与详情（只读；不含 191 绑单/提交）
instructions: |
  「上周/上月/最近N天」等换算为具体的开始、结束日期；只说「本月」时从本月 1 日到今天。
  查多张、按条件筛选用列表工具（分页 index）；员工给出报销单 id/单号要看一张详情时用详情工具。
  员工要看详情但未提供单号/id 时：先追问单号，不要调用详情工具、不要编造 id。
  不要猜测 bindable/提交类能力——本轮只有上述两只读 Tool。
  详情查询成功后，回复正文须直接写出单号、状态、金额、行程日期，以及交通或路线（有则写、路线用可读中文勿贴 JSON）；不得让员工只靠「查看结果」才能看到核心字段。
examples:
  - 查上周的行程报销
  - 本月未报销的行程有哪些
  - 查看报销单 12345 的详情
workflow: travel_query
enabled: true
tools:
  - query_my_travel_expense_list
  - query_my_travel_expense_detail
